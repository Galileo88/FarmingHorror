<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Farming Horror</title>

  <!-- "Add to Home Screen" runs the game fullscreen in landscape -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Farm Horror">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0a12;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;              /* no pinch-zoom or double-tap zoom */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      position: fixed;
      inset: 0;
      height: 100dvh;                  /* ignores the mobile address bar */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Phones held upright: ask the player to turn the phone sideways */
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #0d0a12;
      color: #f4ecd8;
      font: bold 18px/1.4 monospace;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
    }
    #rotate .phone {
      width: 44px;
      height: 76px;
      border: 4px solid #f2a541;
      border-radius: 8px;
      animation: turn 1.8s ease-in-out infinite;
    }
    @keyframes turn {
      0%, 30% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">
    <div class="phone"></div>
    <div>Turn your phone sideways to play</div>
  </div>

  <!-- Engine (Phaser 4, MIT licensed, vendored so the game runs offline) -->
  <script src="lib/phaser.min.js"></script>

  <!-- Game code. Plain scripts (no build step) so you can just open this file. -->
  <script src="src/config.js"></script>
  <script src="src/palette.js"></script>
  <script src="src/art.js"></script>
  <script src="src/font.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/field.js"></script>
  <script src="src/player.js"></script>
  <script src="src/crow.js"></script>
  <script src="src/zombie.js"></script>
  <script src="src/scenes/boot.js"></script>
  <script src="src/scenes/title.js"></script>
  <script src="src/scenes/game.js"></script>
  <script src="src/scenes/hud.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
