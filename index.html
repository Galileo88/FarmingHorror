<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farming Horror</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0a12;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Engine (Phaser 4, MIT licensed, vendored so the game runs offline) -->
  <script src="lib/phaser.min.js"></script>

  <!-- Game code. Plain scripts (no build step) so you can just open this file. -->
  <script src="src/config.js"></script>
  <script src="src/palette.js"></script>
  <script src="src/art.js"></script>
  <script src="src/font.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/field.js"></script>
  <script src="src/player.js"></script>
  <script src="src/crow.js"></script>
  <script src="src/zombie.js"></script>
  <script src="src/scenes/boot.js"></script>
  <script src="src/scenes/title.js"></script>
  <script src="src/scenes/game.js"></script>
  <script src="src/scenes/hud.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
